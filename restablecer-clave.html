<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Restablecer contraseña | Eco Roca</title>
<link rel="stylesheet" href="admin-panel.css">
</head>
<body>
<main class="shell">
<section class="card login">
<a href="./" class="brand">ECO ROCA</a>
<small>PANEL PRIVADO</small>
<h1>Nueva contraseña</h1>
<p id="intro">Abre esta página desde el enlace de recuperación enviado por Supabase.</p>
<form id="resetForm" class="hide">
<label>Nueva contraseña
<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
</label>
<label>Repetir contraseña
<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
</label>
<button id="savePassword" type="submit">Guardar nueva contraseña</button>
</form>
<p id="resetMsg" class="login-msg"></p>
<a id="backAdmin" class="reset-back hide" href="admin.html">Volver al panel de administración</a>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="restablecer-clave.js"></script>
</body>
</html>
