<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración | Eco Roca</title><link rel="stylesheet" href="admin-panel.css"></head><body>
<main class="shell">
<section id="login" class="card login"><a href="./" class="brand">ECO ROCA</a><small>PANEL PRIVADO</small><h1>Administración</h1><p>Inicia sesión para administrar tus productos.</p><div id="setup" class="notice hide">Primero conecta Supabase siguiendo CONFIGURACION-SUPABASE.md.</div><form id="loginForm"><label>Correo<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><button>Ingresar</button></form><p id="msg"></p></section>
<section id="dashboard" class="hide"><header><div><small>ECO ROCA</small><h1>Productos</h1><p>Cambia precios, disponibilidad, textos e imágenes.</p></div><div class="actions"><a href="./" target="_blank">Ver tienda</a><button id="logout">Salir</button></div></header><div id="list"></div></section>
</main>
<template id="tpl"><article class="product"><div class="top"><img class="preview"><div class="grow"><label>Nombre<input class="name"></label><label>Descripción<textarea class="description" rows="2"></textarea></label></div><label class="check"><input class="available" type="checkbox"> Disponible</label></div><label>Imagen nueva<input class="file" type="file" accept="image/jpeg,image/png,image/webp"></label><span class="fileMsg"></span><div class="prices"><b>Calibre</b><b>20 kg</b><b>40 kg</b><span>1–2"</span><input class="a" type="number" min="0"><input class="b" type="number" min="0"><span>2–3"</span><input class="c" type="number" min="0"><input class="d" type="number" min="0"><span>3–5"</span><input class="e" type="number" min="0"><input class="f" type="number" min="0"></div><button class="save">Guardar cambios</button></article></template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin-panel.js"></script></body></html>
